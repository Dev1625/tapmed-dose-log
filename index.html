<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f5ec">
    <meta name="description" content="TapMed demo for package-triggered dose logging and corrections.">
    <link rel="stylesheet" href="./style.css">
    <title>TapMed | Dose log</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>TapMed</div>
        <div class="connection" id="connection">Online</div>
      </div>
    </header>

    <main class="page">
      <div class="page-heading">
        <div>
          <p class="date" id="date"></p>
          <h1>Today’s dose log</h1>
        </div>
        <div class="progress-block" aria-label="Dose progress">
          <p id="count">0 of 3 marked taken</p>
          <progress id="progress" max="3" value="0" aria-label="Doses marked taken"></progress>
        </div>
      </div>

      <section class="tap" aria-labelledby="tap-title">
        <div class="package" aria-hidden="true"><i></i><i></i><i></i></div>
        <div>
          <h2 id="tap-title">Log from the package</h2>
          <p>A package tag opens the dose it belongs to.</p>
        </div>
        <a class="button button-primary" id="tap-button" href="#tap=afternoon">Simulate a package tap <span aria-hidden="true">↗</span></a>
      </section>

      <div class="columns">
        <section aria-labelledby="doses-title">
          <h2 id="doses-title">Scheduled doses</h2>
          <ul class="doses" id="doses"></ul>
        </section>
        <section class="activity" aria-labelledby="activity-title">
          <h2 id="activity-title">Activity</h2>
          <ol class="events" id="events"></ol>
          <p id="empty" hidden>Your dose entries will appear here.</p>
        </section>
      </div>

      <footer class="page-footer">
        <span>Sample doses for this demo</span>
        <span id="storage-status">Entries stay in this browser</span>
      </footer>
    </main>

    <dialog id="entry" aria-labelledby="entry-title" aria-describedby="entry-detail">
      <div class="dialog-top">
        <div>
          <p class="date" id="entry-source"></p>
          <h2 id="entry-title"></h2>
        </div>
        <button class="button button-small" id="close-entry" type="button" aria-label="Close dose entry">×</button>
      </div>
      <p id="entry-detail"></p>
      <label class="note" id="note-label" hidden>
        Correction note <span>(optional)</span>
        <input type="text" id="note" maxlength="140" autocomplete="off">
      </label>
      <div class="choices" id="choices">
        <button class="button button-primary" type="button" data-status="taken">Mark taken</button>
        <button class="button" type="button" data-status="skipped">Mark skipped</button>
        <button class="button" type="button" data-status="pending">Clear status</button>
      </div>
    </dialog>

    <template id="dose-template">
      <li class="dose">
        <div class="dose-marker" aria-hidden="true"></div>
        <div class="dose-info">
          <h3></h3>
          <p class="dose-time"></p>
        </div>
        <span class="pill"></span>
        <button class="button dose-action" type="button"></button>
      </li>
    </template>

    <template id="event-template">
      <li class="event">
        <time></time>
        <h3></h3>
        <p class="event-detail"></p>
        <p class="event-note" hidden></p>
      </li>
    </template>

    <div class="screen-reader" id="announcement" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
